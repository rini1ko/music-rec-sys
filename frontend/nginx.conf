server {
    listen 80;
    root /usr/share/nginx/html;

    # the router lives in the browser: unknown paths get the app, which shows its own 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # file names carry a hash, a new build gets new names
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
