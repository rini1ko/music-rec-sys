[package]
name = "music-recommendation-system"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
futures-util = "0.3"
indicatif = "0.18.6"
petgraph = "0.8.3"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.1"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
